name: set-admin-token (temporary)
on: workflow_dispatch
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set ADMIN_TOKEN Pages secret (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK: ${{ secrets.FAW_ADMIN_TOKEN }}
        run: printf '%s' "$TOK" | npx -y wrangler@3 pages secret put ADMIN_TOKEN --project-name=freeaiwatch 2>&1 | grep -v -F "$TOK"
