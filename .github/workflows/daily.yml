name: daily-check-and-deploy
on:
  schedule: [{cron: "0 12 * * *"}]   # 12:00 UTC = 7:00 AM CT
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/check_sources.py
      - run: python scripts/draft_posts.py
      - name: Commit updated data, snapshots, drafts
        run: |
          git config user.name "freeaiwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data snapshots drafts && git commit -m "daily check $(date -u +%F)" || echo "no changes"
          git push
      - name: Build public dist/
        run: bash scripts/build_dist.sh
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}       # placeholder: add in repo secrets
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}     # placeholder: add in repo secrets
          command: pages deploy dist --project-name=freeaiwatch --branch=main
