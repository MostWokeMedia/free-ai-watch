name: daily-check-and-deploy
on:
  schedule: [{cron: "0 12 * * *"}]   # 12:00 UTC = 7:00 AM CT
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/check_sources.py
      - run: python scripts/draft_posts.py
      - name: Commit updated data, snapshots, drafts
        run: |
          git config user.name "freeaiwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data snapshots drafts && git commit -m "daily check $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}            # placeholder: add in repo secrets
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}          # placeholder
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}  # placeholder
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
